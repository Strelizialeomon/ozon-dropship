# 履约中台 —— Redis 补充配置
# 安装：复制到 /etc/redis/fulfillment-hub.conf，并在 /etc/redis/redis.conf 末尾加一行
#         include /etc/redis/fulfillment-hub.conf
#       （Ubuntu / Debian 的包默认没有可用的 include 目录，就在 redis.conf 末尾加这一行；
#         其余发行版同理——改完 systemctl restart redis-server）
# 目的：asynq 任务不丢（总纲 §5.5）——AOF 开启，灾难时最多丢 1 秒写入。

appendonly yes
appendfsync everysec
